name: rcdb CLI smoke test

# Installs the `rcdb` command from the Python package and exercises the common
# CLI commands against a fresh SQLite database: create schema, add a condition
# type and values, then query them back with info / ls / select / rp.
# Mirrors python-examples.yml and cpp-examples.yml.

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

env:
  # The 4-slash form gives SQLAlchemy an absolute path. All steps read this env var,
  # so no -c/--connection flag is needed.
  RCDB_CONNECTION: "sqlite:////${{ github.workspace }}/cli_smoke.sqlite"

jobs:
  cli-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install rcdb (provides the `rcdb` command)
        run: |
          python -m pip install --upgrade pip
          pip install --editable $GITHUB_WORKSPACE/python

      # ── Each command gets its own step so a failure points at the culprit ──

      - name: "rcdb --version"
        run: rcdb --version

      - name: "No connection fails cleanly (no traceback)"
        env:
          RCDB_CONNECTION: ""
        run: |
          # A command that needs the DB must exit non-zero with a clear message,
          # not crash with a Python traceback.
          set +e
          OUT=$(rcdb select "event_count > 0" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          echo "exit code: $CODE"
          test "$CODE" -ne 0
          echo "$OUT" | grep -q "No connection provided"
          if echo "$OUT" | grep -q "Traceback"; then
            echo "ERROR: command crashed with a traceback instead of a clean error"
            exit 1
          fi
          # `--help` must still work without a connection
          rcdb select --help >/dev/null

      - name: "Create schema (db init)"
        run: rcdb db init --confirm

      - name: "Add a condition type and values"
        run: |
          rcdb add type beam_current --type=float --description "Beam current in nA"
          rcdb add condition 100 beam_current 12.5
          rcdb add condition 101 beam_current 0.0

      - name: "Summary (info)"
        run: |
          OUT=$(rcdb info)
          echo "$OUT"
          echo "$OUT" | grep -q "Number of runs: 2"

      - name: "List condition types (ls)"
        run: |
          OUT=$(rcdb ls)
          echo "$OUT"
          echo "$OUT" | grep -q "beam_current"

      - name: "Select with a query"
        run: |
          # beam_current > 5 must match run 100 (12.5) and exclude run 101 (0.0).
          # The third arg selects beam_current as a view column, so the actual
          # VALUE must appear in the output - not just the run number.
          OUT=$(rcdb select "beam_current > 5" 100-101 beam_current)
          echo "$OUT"
          echo "$OUT" | grep -q "100"
          echo "$OUT" | grep -q "12.5"   # value column must be populated, not empty
          if echo "$OUT" | grep -qw "101"; then
            echo "ERROR: run 101 (beam_current=0.0) should not match 'beam_current > 5'"
            exit 1
          fi

      - name: "Select export view (--dump)"
        run: |
          OUT=$(rcdb select "beam_current > 5" 100-101 --dump)
          echo "$OUT"
          # dump view prepends a "#! " header line
          echo "$OUT" | grep -q "^#!"

      - name: "List run periods (rp)"
        run: rcdb rp

      # ── file command group: vers / cat / runs / ls / search ──
      - name: "Add file versions for the file commands"
        run: |
          # One logical file (/conf/daq.conf) with two versions:
          #   "TRIGGER v1" on runs 100, 101
          #   "TRIGGER v2 CHANGED" on run 102
          # Plus a second file so `ls` / `search` have something to distinguish.
          rcdb add file 100 /conf/daq.conf --content "TRIGGER v1"
          rcdb add file 101 /conf/daq.conf --content "TRIGGER v1"
          rcdb add file 102 /conf/daq.conf --content "TRIGGER v2 CHANGED"
          rcdb add file 100 /conf/other.conf --content "unrelated content"

      - name: "file vers (versions of a file)"
        run: |
          OUT=$(rcdb file vers /conf/daq.conf)
          echo "$OUT"
          # Two distinct versions, the newer one last used on run 102.
          test "$(echo "$OUT" | grep -c .)" -eq 2
          echo "$OUT" | grep -q -- "- 102"

      - name: "file cat (pipe to grep)"
        run: |
          # The version used in run 102 must contain the changed marker.
          rcdb file cat /conf/daq.conf 102 | grep -q "CHANGED"
          # The version used in run 100 must NOT contain it.
          if rcdb file cat /conf/daq.conf 100 | grep -q "CHANGED"; then
            echo "ERROR: run 100 should have the v1 content, not the changed one"
            exit 1
          fi

      - name: "file runs (per-run versions, sorted desc, limited)"
        run: |
          OUT=$(rcdb file runs /conf/daq.conf --desc --limit=2)
          echo "$OUT"
          # Last two runs descending => 102 then 101.
          test "$(echo "$OUT" | sed -n '1p' | cut -d' ' -f1)" = "102"
          test "$(echo "$OUT" | sed -n '2p' | cut -d' ' -f1)" = "101"

      - name: "file ls (all files for a run)"
        run: |
          OUT=$(rcdb file ls --run=100)
          echo "$OUT"
          echo "$OUT" | grep -q "/conf/daq.conf"
          echo "$OUT" | grep -q "/conf/other.conf"

      - name: "file ls positional run / range"
        run: |
          # `ls 100` is shorthand for `ls --run=100`
          rcdb file ls 100 | grep -q "/conf/daq.conf"
          # `ls 102-103` is a run range: only daq.conf (v2) spans it, not other.conf
          OUT=$(rcdb file ls 102-103)
          echo "$OUT"
          echo "$OUT" | grep -q "/conf/daq.conf"
          if echo "$OUT" | grep -q "/conf/other.conf"; then
            echo "ERROR: other.conf (run 100 only) should not appear in range 102-103"
            exit 1
          fi

      - name: "file search (substring of file name)"
        run: |
          OUT=$(rcdb file search daq)
          echo "$OUT"
          echo "$OUT" | grep -q "/conf/daq.conf"
          if echo "$OUT" | grep -q "/conf/other.conf"; then
            echo "ERROR: 'daq' search should not match /conf/other.conf"
            exit 1
          fi
          # Search is case-insensitive: an upper-case pattern still matches.
          rcdb file search DAQ | grep -q "/conf/daq.conf"
